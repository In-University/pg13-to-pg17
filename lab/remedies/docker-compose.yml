name: pg-remedies
# Lab "giải pháp không sửa code" cho mẫu CASE 4 (CTE + UPDATE ... NOT IN).
# Máy nhỏ (2 vCPU / 2 GB RAM) nên dùng bộ nhớ thấp. work_mem để 4MB ở mức instance như mặc định PostgreSQL,
# để các giải pháp theo role / database / hint table có ý nghĩa.
x-pg-flags: &pgflags
  - -c
  - shared_buffers=256MB
  - -c
  - work_mem=4MB
  - -c
  - maintenance_work_mem=128MB
  - -c
  - effective_cache_size=1GB
  - -c
  - random_page_cost=1.1
  - -c
  - max_parallel_workers_per_gather=2
  - -c
  - shared_preload_libraries=pg_stat_statements,pg_hint_plan
  - -c
  - pg_hint_plan.enable_hint_table=on

services:
  rpg13:
    build: { context: ., args: { PG_MAJOR: "13" } }
    image: pgdoctor-lab:13-hint
    container_name: rpg13
    environment: { POSTGRES_PASSWORD: postgres }
    volumes: [ "../sql:/sql:ro", "./sql:/rsql:ro" ]
    command: *pgflags          # PG13 không có compute_query_id
    shm_size: 256m
  rpg17:
    build: { context: ., args: { PG_MAJOR: "17" } }
    image: pgdoctor-lab:17-hint
    container_name: rpg17
    environment: { POSTGRES_PASSWORD: postgres }
    volumes: [ "../sql:/sql:ro", "./sql:/rsql:ro" ]
    command: [ "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=128MB",
               "-c", "effective_cache_size=1GB", "-c", "random_page_cost=1.1", "-c", "max_parallel_workers_per_gather=2",
               "-c", "shared_preload_libraries=pg_stat_statements,pg_hint_plan", "-c", "pg_hint_plan.enable_hint_table=on",
               "-c", "compute_query_id=on" ]
    shm_size: 256m
